version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      n8n:
        patterns: ["@n8n/*", "n8n-workflow"]
      lint:
        patterns: ["oxfmt", "oxlint", "oxlint-tsgolint", "ultracite", "eslint"]
      tooling:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
